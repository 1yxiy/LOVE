<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <title>OUR LITTLE UNIVERSE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
/* ===== X-RAY ARCHIVE THEME v3 — HOLO EDITION (디자인만 변경 / 내용·JS 동일) ===== */
:root {
  --bg: #05060f;
  --ink: #fff8ec;
  --dim: #c6c1d4;
  --line: rgba(255, 236, 200, 0.5);
  --faint: rgba(255, 236, 200, 0.10);
  --glow: rgba(255, 214, 128, 0.6);
  --tint: #ffd98a;
  --pink: #ffb3a1;
  --violet: #8fb0ff;
  --holo: linear-gradient(100deg, #fff4d8 0%, #ffd98a 28%, #ffbf66 48%, #a9c2ff 78%, #fff4d8 100%);
  --panel: linear-gradient(160deg, rgba(255,214,128,.09), rgba(122,160,255,.04) 55%, rgba(255,179,161,.07));
  --xray: grayscale(1) invert(1) contrast(1.25) brightness(1.12) sepia(1) saturate(2.4) hue-rotate(-6deg) drop-shadow(0 0 12px rgba(255,214,128,.75));
  --brackets:
    linear-gradient(currentColor, currentColor) 0 0 / 14px 2px no-repeat,
    linear-gradient(currentColor, currentColor) 0 0 / 2px 14px no-repeat,
    linear-gradient(currentColor, currentColor) 100% 0 / 14px 2px no-repeat,
    linear-gradient(currentColor, currentColor) 100% 0 / 2px 14px no-repeat,
    linear-gradient(currentColor, currentColor) 0 100% / 14px 2px no-repeat,
    linear-gradient(currentColor, currentColor) 0 100% / 2px 14px no-repeat,
    linear-gradient(currentColor, currentColor) 100% 100% / 14px 2px no-repeat,
    linear-gradient(currentColor, currentColor) 100% 100% / 2px 14px no-repeat;
  --kr: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", var(--kr), monospace;
  --thin: "Cormorant Garamond", "Pretendard Variable", Pretendard, serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--kr); font-weight: 400; line-height: 1.7;
  letter-spacing: -0.01em; word-break: keep-all;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  counter-reset: chr com;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--tint); outline-offset: 3px; }
.mono { font-family: var(--mono); }
.small { font-size: 12px; letter-spacing: .2em; color: var(--dim); }

/* ===== 배경: 딥스페이스 + 위에서 쏟아지는 빛줄기 + 별빛 ===== */
.bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 45% at 50% -8%, rgba(255,214,128,.30), transparent 70%),
    radial-gradient(circle at 92% 6%, transparent 219px, rgba(255,214,128,.26) 220px, transparent 222px),
    radial-gradient(circle at 4% 96%, transparent 299px, rgba(255,179,161,.20) 300px, transparent 302px),
    radial-gradient(ellipse 50% 40% at 12% 85%, rgba(90,130,255,.22), transparent 70%),
    radial-gradient(ellipse 45% 35% at 90% 75%, rgba(255,179,161,.12), transparent 70%),
    linear-gradient(rgba(255,236,200,.06) 1px, transparent 1px) 0 0 / 120px 120px,
    linear-gradient(90deg, rgba(255,236,200,.06) 1px, transparent 1px) 0 0 / 120px 120px,
    radial-gradient(ellipse at 50% 115%, #12204a, var(--bg) 72%);
}
.bg::before { /* god rays */
  content: ""; position: absolute; inset: 0 -10% 0; transform-origin: 50% 0;
  background: conic-gradient(from 158deg at 50% -8%,
    transparent 0deg, rgba(255,214,128,.00) 2deg, rgba(255,214,128,.14) 5deg, transparent 8deg,
    transparent 11deg, rgba(255,236,200,.08) 13deg, transparent 17deg,
    transparent 19deg, rgba(255,214,128,.12) 22deg, rgba(255,214,128,.05) 25deg, transparent 28deg,
    transparent 31deg, rgba(255,236,200,.09) 34deg, transparent 38deg,
    transparent 40deg, rgba(255,214,128,.12) 43deg, transparent 47deg,
    transparent 49deg, rgba(255,236,200,.07) 52deg, transparent 56deg, transparent 360deg);
  -webkit-mask-image: linear-gradient(180deg, #000 0, transparent 78%); mask-image: linear-gradient(180deg, #000 0, transparent 78%);
  animation: sway 16s ease-in-out infinite alternate;
}
.bg::after { /* 별 + 빛 알갱이 */
  content: ""; position: absolute; inset: 0 0 -60px 0;
  background:
    radial-gradient(1.6px 1.6px at 8% 18%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 21% 64%, #fff1cf, transparent 60%),
    radial-gradient(1.8px 1.8px at 34% 12%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 47% 78%, #ffe3c4, transparent 60%),
    radial-gradient(1.6px 1.6px at 58% 30%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 69% 88%, #fff1cf, transparent 60%),
    radial-gradient(1.8px 1.8px at 81% 52%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 90% 14%, #cfdcff, transparent 60%),
    radial-gradient(1.6px 1.6px at 95% 70%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 14% 92%, #fff, transparent 60%),
    radial-gradient(5px 5px at 26% 40%, rgba(255,214,128,.55), transparent 70%),
    radial-gradient(4px 4px at 73% 66%, rgba(255,236,200,.5), transparent 70%),
    radial-gradient(6px 6px at 55% 8%, rgba(255,214,128,.45), transparent 70%),
    radial-gradient(4px 4px at 40% 92%, rgba(255,214,128,.4), transparent 70%),
    radial-gradient(5px 5px at 86% 36%, rgba(255,236,200,.45), transparent 70%);
  animation: twinkle 4.5s ease-in-out infinite alternate, drift 34s ease-in-out infinite alternate;
}
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes twinkle { from { opacity: .3; } to { opacity: 1; } }
@keyframes drift { to { transform: translateY(-60px); } }

body::before { /* 아주 옅은 스캔라인 */
  content: ""; position: fixed; inset: 0; z-index: 98; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: 99; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
  opacity: .06; mix-blend-mode: screen;
}

/* ===== 화면 전환 ===== */
.screen {
  position: fixed; inset: 0;
  opacity: 0; visibility: hidden;
  transform: scale(1.03); filter: blur(6px);
  transition: opacity .7s ease, transform .7s ease, filter .7s ease, visibility 0s .7s;
}
.screen.active {
  opacity: 1; visibility: visible; transform: none; filter: none;
  transition: opacity .7s ease, transform .7s ease, filter .7s ease;
}

/* 공용: 홀로그램 글자 */
.intro h1, .home-title, .page-body h2 {
  background: var(--holo); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.intro h1, .home-title { animation: holo 9s linear infinite; }
@keyframes holo { to { background-position: 200% 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 인트로 ===== */
.intro {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 18px; padding: 6vw; overflow: hidden;
  background: radial-gradient(60% 38% at 50% 108%, rgba(255,200,110,.28), transparent 72%);
}
.intro::before {
  content: ""; position: absolute; z-index: -1; left: 50%; top: 50%;
  width: min(135vw, 840px); aspect-ratio: 1; margin: calc(min(135vw, 840px) / -2) 0 0 calc(min(135vw, 840px) / -2);
  border-radius: 50%; border: 1px dashed rgba(255,214,128,.38);
  box-shadow: inset 0 0 120px rgba(255,214,128,.08), 0 0 70px rgba(255,214,128,.08);
  background: radial-gradient(circle at 0 50%, #fff 0 3px, var(--tint) 4px, transparent 9px);
  animation: spin 80s linear infinite;
}
.intro::after {
  content: ""; position: absolute; z-index: -1; left: 50%; top: 50%;
  width: min(92vw, 560px); aspect-ratio: 1; margin: calc(min(92vw, 560px) / -2) 0 0 calc(min(92vw, 560px) / -2);
  border-radius: 50%; border: 1px solid rgba(255,179,161,.32);
  background: radial-gradient(circle at 100% 50%, #fff 0 2.5px, var(--pink) 3.5px, transparent 8px);
  animation: spin 50s linear infinite reverse;
}
.intro-scan {
  position: absolute; left: 0; right: 0; height: 35%; pointer-events: none;
  background: linear-gradient(transparent, rgba(255,214,128,.04) 70%, rgba(255,214,128,.13) 99%, transparent);
  animation: scan 5s ease-in-out infinite;
}
@keyframes scan { from { top: -35%; } to { top: 100%; } }
.blink { animation: blink 1.4s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.intro h1 {
  font-weight: 300; font-size: clamp(34px, 6.4vw, 80px); line-height: 1.25;
  letter-spacing: -0.035em; padding-bottom: .1em;
  filter: drop-shadow(0 0 22px rgba(255,214,128,.45));
}
.intro .coord { position: absolute; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
.subtitle { font-family: var(--thin); font-style: italic; font-weight: 500; font-size: 24px; color: var(--tint); text-shadow: 0 0 16px var(--glow); }

.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .22em; color: var(--tint); text-transform: uppercase; }
.eyebrow::before { content: "[ "; color: var(--dim); } .eyebrow::after { content: " ]"; color: var(--dim); }

.btn {
  position: relative; margin-top: 28px; min-height: 54px; padding: 16px 46px;
  font-family: var(--mono); font-size: 14px; font-weight: 500; letter-spacing: .3em; color: var(--ink);
  border: 1px solid transparent;
  background: linear-gradient(var(--bg), var(--bg)) padding-box, var(--holo) border-box;
  background-size: auto, 200% 100%;
  box-shadow: 0 0 24px rgba(255,214,128,.25);
  animation: btnPulse 2.8s ease-in-out infinite, holo 6s linear infinite;
  transition: color .3s, box-shadow .3s, transform .2s;
}
@keyframes btnPulse { 50% { box-shadow: 0 0 46px rgba(122,160,255,.5); } }
.btn::after {
  content: ""; position: absolute; right: -5px; bottom: -5px; width: 9px; height: 9px;
  border-radius: 50%; border: 1px solid var(--tint); background: var(--bg);
}
.btn:hover, .btn:active {
  color: #05060f; transform: translateY(-2px);
  background: linear-gradient(rgba(255,244,216,.95), rgba(122,160,255,.92)) padding-box, var(--holo) border-box;
  background-size: auto, 200% 100%;
  box-shadow: 0 0 44px var(--glow);
}

/* ===== 홈 ===== */
.home {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center;
  gap: 5vw; padding: 5vh 8vw; overflow-y: auto;
}
.home-art { position: relative; aspect-ratio: 1; max-height: 78vh; justify-self: center; width: 100%; }
.home-art::before {
  content: ""; position: absolute; inset: -4%; border-radius: 50%;
  background: conic-gradient(rgba(255,214,128,0), rgba(255,214,128,.38), rgba(122,160,255,.38), rgba(255,179,161,.38), rgba(255,214,128,0));
  -webkit-mask: radial-gradient(circle, #000 38%, transparent 72%); mask: radial-gradient(circle, #000 38%, transparent 72%);
  animation: spin 18s linear infinite;
}
.home-art::after {
  content: ""; position: absolute; inset: 27%; border-radius: 50%;
  border: 1px solid rgba(255,179,161,.5);
  background: radial-gradient(circle at 50% 0, #fff 0 2.5px, var(--pink) 3.5px, transparent 8px);
  animation: spin 28s linear infinite;
}
.orbit { position: absolute; border-radius: 50%; animation: spin 40s linear infinite; }
.orbit-a { inset: 0; border: 1px dashed rgba(255,214,128,.6); }
.orbit-b {
  inset: 16%; border: 1px solid rgba(255,236,200,.38); animation-direction: reverse; animation-duration: 60s;
  box-shadow: 0 0 40px rgba(255,214,128,.14), inset 0 0 40px rgba(255,214,128,.08);
}
.orbit-a::after {
  content: ""; position: absolute; top: 50%; left: -6px; width: 11px; height: 11px;
  border-radius: 50%; background: #fff; box-shadow: 0 0 18px 3px var(--glow);
}
.orbit-b::after {
  content: ""; position: absolute; top: 50%; right: -5px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--violet); box-shadow: 0 0 16px 3px rgba(122,160,255,.7);
}
.core {
  position: absolute; inset: 36%; display: grid; place-items: center;
  font-size: clamp(34px, 5vw, 56px); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,250,235,.42), rgba(255,214,128,.22) 40%, transparent 72%);
  border: 1px solid rgba(255,236,200,.35);
  box-shadow: 0 0 50px rgba(255,214,128,.35), inset 0 0 30px rgba(122,160,255,.25);
  color: #fff4d8; text-shadow: 0 0 22px #ffd98a, 0 0 48px rgba(255,190,100,.8);
  animation: breathe 4.5s ease-in-out infinite;
}
.core::before, .core::after {
  content: ""; position: absolute; left: 50%; top: 50%; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255,244,216,.95) 50%, transparent);
  translate: -50% -50%; animation: flare 4.5s ease-in-out infinite;
}
.core::before { width: 340%; height: 2px; }
.core::after { width: 2px; height: 340%; background: linear-gradient(180deg, transparent, rgba(255,244,216,.95) 50%, transparent); }
@keyframes flare { 50% { opacity: .35; scale: .8; } }
@keyframes breathe { 50% { transform: scale(1.07); box-shadow: 0 0 80px rgba(122,160,255,.45), inset 0 0 36px rgba(255,179,161,.3); } }

.home-title {
  font-weight: 300; font-size: clamp(28px, 3.5vw, 50px); line-height: 1.3;
  margin: 12px 0 26px; letter-spacing: -0.035em; padding-bottom: .08em;
  filter: drop-shadow(0 0 18px rgba(255,214,128,.35));
}

.hero-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
.hero-meta div {
  position: relative; padding: 12px 18px; border: 1px solid var(--line);
  background: var(--panel); font-family: var(--mono);
}
.hero-meta div::before {
  content: ""; position: absolute; left: -1px; top: -1px; width: 14px; height: 14px;
  border-top: 2px solid var(--tint); border-left: 2px solid var(--tint);
}
.hero-meta span { display: block; font-size: 11px; letter-spacing: .22em; color: var(--dim); }
.hero-meta strong { font-weight: 500; font-size: 14px; letter-spacing: .08em; color: var(--ink); }
.hero-meta div:nth-child(2) strong::before {
  content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 9px; border-radius: 50%;
  background: var(--pink); box-shadow: 0 0 10px 2px rgba(255,179,161,.7); vertical-align: 1px;
  animation: blink 1.6s steps(2) infinite;
}

.menu { display: flex; flex-direction: column; gap: 10px; }
.menu button {
  position: relative; display: flex; align-items: center; gap: 16px; text-align: left;
  min-height: 66px; padding: 14px 52px 14px 20px;
  border: 1px solid var(--faint);
  background: linear-gradient(90deg, rgba(255,214,128,.20), rgba(255,179,161,.14)) left / 0% 100% no-repeat, var(--panel);
  font-family: var(--thin); font-weight: 600; font-size: clamp(22px, 2.5vw, 30px); letter-spacing: .12em;
  transition: background-size .45s ease, transform .3s, border-color .3s, box-shadow .3s, color .3s;
}
.menu button::before {
  content: ""; position: absolute; left: -1px; top: 14%; width: 3px; height: 72%;
  background: var(--holo); opacity: .55; transition: opacity .3s;
}
.menu button::after {
  content: ""; position: absolute; right: 22px; top: 50%; width: 9px; height: 9px;
  border-top: 2px solid var(--tint); border-right: 2px solid var(--tint);
  transform: translateY(-50%) rotate(45deg); transition: transform .3s, border-color .3s;
}
.menu em {
  font-family: var(--mono); font-style: normal; font-size: 12px; letter-spacing: .1em; color: var(--tint);
  padding: 2px 8px; border: 1px solid rgba(255,214,128,.45); background: rgba(255,214,128,.08);
}
.menu small { margin-left: auto; font-family: var(--kr); font-size: 14px; color: var(--dim); letter-spacing: 0; }
.menu button:hover, .menu button:active, .menu button:focus-visible {
  background-size: 100% 100%, auto; transform: translateX(6px); color: #fff;
  border-color: rgba(255,214,128,.7); text-shadow: 0 0 16px var(--glow);
  box-shadow: 0 0 30px rgba(255,214,128,.18);
}
.menu button:hover::before, .menu button:active::before { opacity: 1; }
.menu button:hover::after, .menu button:active::after { transform: translate(5px, -50%) rotate(45deg); border-color: var(--pink); }
.menu button:hover small, .menu button:active small { color: var(--pink); text-shadow: none; }

.hero-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.hero-links a {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px;
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  border: 1px solid var(--line); background: var(--panel); transition: .25s;
}
.hero-links a:hover, .hero-links a:active {
  background: var(--ink); color: var(--bg); box-shadow: 0 0 26px var(--glow); transform: translateY(-2px);
}

/* ===== 서브 페이지 ===== */
.page { display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) 6vw 0; }
.page-head {
  position: relative; display: flex; align-items: center; gap: 20px; padding: 22px 0;
  border-bottom: 1px solid var(--faint); flex-shrink: 0;
}
.page-head::after {
  content: ""; position: absolute; left: 0; bottom: -1px; width: 140px; height: 2px; background: var(--holo);
}
.back {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px;
  font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .15em;
  border: 1px solid var(--line); background: var(--panel); transition: .25s;
}
.back:hover, .back:active { background: var(--ink); color: var(--bg); box-shadow: 0 0 24px var(--glow); }
.count {
  margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .1em;
  color: var(--pink); border: 1px solid rgba(255,179,161,.55); background: rgba(255,179,161,.08); padding: 7px 14px;
}
.page-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 36px 0 calc(64px + env(safe-area-inset-bottom, 0px));
  scrollbar-width: thin; scrollbar-color: rgba(255,214,128,.35) transparent;
}
.page-body.center { display: flex; flex-direction: column; align-items: center; text-align: center; }
.page-body.center > h2 { margin-top: auto; }
.page-body.center > .story-card { margin-bottom: auto; } /* 긴 글도 위가 잘리지 않게 */
.page-body h2 {
  font-family: var(--thin); font-weight: 500; font-size: clamp(38px, 5.2vw, 66px); line-height: 1.1;
  margin-bottom: 40px; letter-spacing: -0.01em; padding-bottom: .06em;
  filter: drop-shadow(0 0 16px rgba(255,214,128,.35));
}
.page-body h2::after { content: ""; display: block; width: 64px; height: 2px; margin-top: 14px; background: var(--holo); }
.page-body.center h2::after { margin-inline: auto; }

.story-card {
  position: relative; width: min(100%, 760px); padding: 46px 50px; text-align: left;
  border: 1px solid rgba(255,236,200,.38);
  background: var(--panel), rgba(8,12,26,.74);
  box-shadow: 0 20px 80px rgba(0,0,0,.5), 0 0 60px rgba(255,214,128,.09);
  font-size: 17px; line-height: 2; color: #fff6e6; white-space: pre-line;
}
.story-card::before {
  content: "world.txt"; position: absolute; top: -11px; left: 22px; padding: 0 10px;
  background: var(--bg); font-family: var(--mono); font-size: 12px; color: var(--tint);
}
.story-card::after {
  content: ""; position: absolute; inset: -7px; pointer-events: none; color: var(--tint); background: var(--brackets);
}

/* ===== 사진: 평소엔 원본, 올리면(터치하면) x-ray ===== */
.character-image img, .commission-image img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: filter .6s ease, transform .6s ease;
}
.character-card:hover img, .character-card:active img,
.commission-card:hover img, .commission-card:active img {
  animation: none; filter: var(--xray); transform: scale(1.04);
}
/* 터치 기기: 호버가 없으니 사진이 주기적으로 스스로 x-ray 스캔됨 */
@media (hover: none) {
  .character-image img, .commission-image img { animation: xrayCycle 8s ease-in-out infinite; }
  .character-card:nth-child(even) img { animation-delay: -4s; }
  .commission-card:nth-child(3n+2) img { animation-delay: -2.6s; }
  .commission-card:nth-child(3n) img { animation-delay: -5.3s; }
}
@keyframes xrayCycle {
  0%, 60%, 100% { filter: none; transform: none; }
  70%, 88% { filter: var(--xray); transform: scale(1.04); }
}

/* 스캔 빔 (이미지 위를 훑고 지나감) */
.character-card::before, .commission-card::before {
  content: ""; position: absolute; left: 0; top: 0; width: 100%; z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(255,214,128,.26) 70%, rgba(255,244,216,.75) 99%, transparent) 0 -40% / 100% 28% no-repeat;
  mix-blend-mode: screen; animation: beam 5.5s linear infinite;
}
.character-card::before { aspect-ratio: 3 / 4; }
.commission-card::before { aspect-ratio: 1; }
.character-card:nth-child(even)::before { animation-delay: -2.7s; }
.commission-card:nth-child(3n+2)::before { animation-delay: -1.8s; }
.commission-card:nth-child(3n)::before { animation-delay: -3.7s; }
@keyframes beam { 0% { background-position: 0 -40%; } 62%, 100% { background-position: 0 140%; } }

/* 캐릭터 */
.character-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 340px));
  justify-content: center; gap: 56px 48px; padding-top: 12px;
}
.character-card { position: relative; counter-increment: chr; }
.character-card:nth-child(even) { margin-top: 64px; }
.character-image {
  position: relative; aspect-ratio: 3 / 4; overflow: hidden;
  border: 1px solid rgba(255,236,200,.7); background: radial-gradient(circle at 50% 30%, #1b2646, #0a0e1b);
  display: grid; place-items: center; font-family: var(--mono); font-size: 34px; color: var(--dim);
  box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 36px rgba(255,214,128,.14);
  transition: border-color .4s, box-shadow .4s;
}
.character-image::before {
  content: "subject_0" counter(chr) ".png"; position: absolute; z-index: 3; top: 14px; left: 16px;
  padding: 3px 8px; font-family: var(--mono); font-size: 11px; color: var(--ink);
  background: rgba(6,8,16,.66); border: 1px solid rgba(255,236,200,.3);
}
.character-image::after {
  content: ""; position: absolute; inset: 6px; z-index: 2; pointer-events: none;
  color: rgba(255,244,216,.9); background: var(--brackets);
}
.character-card:hover .character-image, .character-card:active .character-image {
  border-color: var(--tint); box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 56px rgba(255,214,128,.4);
}
.character-card:hover .character-image::before, .character-card:active .character-image::before {
  content: "subject_0" counter(chr) ".xray"; color: var(--tint); border-color: var(--tint);
}
.character-card::after {
  content: "-39.4567" counter(chr); position: absolute; z-index: 3; top: 14px; right: 16px;
  font-family: var(--mono); font-size: 11px; padding: 3px 8px; color: var(--ink);
  border: 1px solid rgba(255,179,161,.6); background: rgba(255,179,161,.18);
}
.character-info {
  margin-top: 16px; padding-left: 14px; border-left: 2px solid transparent;
  border-image: linear-gradient(180deg, var(--tint), var(--pink)) 1;
}
.character-name { font-weight: 600; font-size: 26px; letter-spacing: -0.02em; line-height: 1.3; }
.character-role { font-size: 14px; font-weight: 500; color: var(--tint); }

/* 커미션 */
.commission-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 30px; }
.commission-card { position: relative; display: block; counter-increment: com; transition: transform .3s; }
.commission-card:hover, .commission-card:active { transform: translateY(-4px); }
.commission-image {
  position: relative; aspect-ratio: 1; overflow: hidden;
  border: 1px solid rgba(255,236,200,.55); background: radial-gradient(circle at 50% 30%, #1b2646, #0a0e1b);
  display: grid; place-items: center; font-family: var(--mono); font-size: 28px; color: var(--dim);
  box-shadow: 0 12px 36px rgba(0,0,0,.5);
  transition: border-color .3s, box-shadow .3s;
}
.commission-card:hover .commission-image, .commission-card:active .commission-image {
  border-color: var(--tint); box-shadow: 0 12px 36px rgba(0,0,0,.5), 0 0 40px var(--glow);
}
.commission-image::before {
  content: "archive_" counter(com) ".png"; position: absolute; z-index: 3; bottom: 10px; right: 12px;
  padding: 2px 7px; font-family: var(--mono); font-size: 10px; color: var(--ink);
  background: rgba(6,8,16,.66); border: 1px solid rgba(255,236,200,.3);
}
.commission-image::after {
  content: ""; position: absolute; inset: 6px; z-index: 2; pointer-events: none;
  color: rgba(255,244,216,.85); background: var(--brackets);
}
.commission-card:hover .commission-image::before, .commission-card:active .commission-image::before {
  content: "archive_" counter(com) ".xray"; color: var(--tint); border-color: var(--tint);
}
.commission-info { padding-top: 14px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.commission-info h3 { font-weight: 500; font-size: 17px; line-height: 1.4; }
.commission-info p { font-family: var(--mono); font-size: 12px; color: var(--dim); text-align: right; }

/* ===== 모바일 ===== */
@media (max-width: 820px) {
  .home {
    grid-template-columns: 1fr; align-content: start; gap: 22px;
    padding: calc(30px + env(safe-area-inset-top, 0px)) 6vw calc(56px + env(safe-area-inset-bottom, 0px));
  }
  .home-art { width: min(58vw, 250px); max-height: none; }
  .home-title { font-size: clamp(28px, 8vw, 38px); margin-bottom: 22px; }
  .menu button { min-height: 68px; font-size: 24px; }
  .hero-meta div { flex: 1 1 140px; }

  .page { padding-left: 5vw; padding-right: 5vw; }
  .page-head { padding: 14px 0; gap: 14px; }
  .page-head .eyebrow { letter-spacing: .1em; font-size: 11px; }
  .page-head .eyebrow::before, .page-head .eyebrow::after { content: none; }
  .page-head:has(.count) .eyebrow { display: none; }
  .page-body { padding-top: 28px; }
  .page-body h2 { margin-bottom: 30px; }

  .story-card { padding: 32px 22px; font-size: 16.5px; line-height: 1.95; }
  .story-card::after { inset: -5px; }

  .character-grid { gap: 44px; }
  .character-card:nth-child(even) { margin-top: 0; }
  .character-name { font-size: 24px; }

  .commission-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; }
  .commission-info { flex-direction: column; align-items: flex-start; gap: 0; padding-top: 10px; }
  .commission-info h3 { font-size: 15px; }
  .commission-info p { font-size: 11.5px; text-align: left; }
  .commission-image::before { font-size: 9px; bottom: 8px; right: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- ===== 화면 0: 인트로 ===== -->
  <section class="screen intro active" id="screen-intro">
    <div class="intro-scan" aria-hidden="true"></div>
    <p class="mono small blink">[ SCANNING ARCHIVE . . . ]</p>
    <p class="eyebrow" id="eyebrow">DREAM COUPLE ARCHIVE</p>
    <h1 id="title">이 꿈을 보관할 수 있을까요?</h1>
    <p class="subtitle" id="tagline"></p>
    <button class="btn big" data-go="home">ENTER ↗</button>
    <p class="mono small coord">-39.4567 / 28.7896.543</p>
  </section>

  <!-- ===== 화면 1: 홈 ===== -->
  <section class="screen home" id="screen-home">
    <div class="home-art" aria-hidden="true">
      <div class="orbit orbit-a"></div>
      <div class="orbit orbit-b"></div>
      <div class="core">✦</div>
    </div>

    <div class="home-copy">
      <p class="eyebrow">Astra Knyght Academy</p>
      <h2 class="home-title" id="homeTitle">이 꿈을 보관할 수 있을까요?</h2>

      <div class="hero-meta">
        <div><span>START</span><strong id="start"></strong></div>
        <div><span>STATUS</span><strong>FOREVER IN PROGRESS</strong></div>
      </div>

      <nav class="menu">
        <button data-go="story"><em>01</em> STORY <small>피로스 별</small></button>
        <button data-go="characters"><em>02</em> CHARACTERS <small>사람</small></button>
        <button data-go="commission"><em>03</em> COMMISSION </button>
      </nav>

      <div class="hero-links">
        <a id="musicLink" href="#" target="_blank" rel="noopener">♫ Music</a>
        <a id="mainLink" href="#" target="_blank" rel="noopener">↗ Link</a>
      </div>
    </div>
  </section>

  <!-- ===== 화면 2: 스토리 ===== -->
  <section class="screen page" id="screen-story">
    <header class="page-head">
      <button class="back" data-go="home">← HOME</button>
      <p class="eyebrow">01 / STORY</p>
    </header>
    <div class="page-body center">
      <h2>World view</h2>
      <div class="story-card"><p id="worldDescription"></p></div>
    </div>
  </section>

  <!-- ===== 화면 3: 캐릭터 ===== -->
  <section class="screen page" id="screen-characters">
    <header class="page-head">
      <button class="back" data-go="home">← HOME</button>
      <p class="eyebrow">02 / CHARACTERS</p>
    </header>
    <div class="page-body">
      <h2>Two souls, one orbit</h2>
      <div class="character-grid" id="characterGrid"></div>
    </div>
  </section>

  <!-- ===== 화면 4: 커미션 ===== -->
  <section class="screen page" id="screen-commission">
    <header class="page-head">
      <button class="back" data-go="home">← HOME</button>
      <p class="eyebrow">03 / COMMISSION</p>
      <span class="count" id="commissionCount">0 ARCHIVES</span>
    </header>
    <div class="page-body">
      <h2>Back up</h2>
      <div class="commission-grid" id="commissionGrid"></div>
    </div>
  </section>

  <script>
async function loadSite() {
  try {
    const response = await fetch("data/notion.json", { cache: "no-store" });
    const site = await response.json();
    renderSite(site);
  } catch (error) {
    console.error("Could not load site data:", error);
  }
}

function renderSite(site) {
  const world = site.world || {};
  document.title = world.browserTitle || "OUR LITTLE UNIVERSE";
  text("eyebrow", world.eyebrow || "DREAM COUPLE ARCHIVE");
  text("title", world.title || "");
  text("homeTitle", world.title || "");
  text("tagline", world.tagline || "");
  text("start", world.start || "");
  text("worldDescription", world.description || "");
  link("musicLink", world.music, "♫ Music");
  link("mainLink", world.link, "↗ Link");

  const characters = site.characters || [];
  document.getElementById("characterGrid").innerHTML = characters.map((item, i) => `
    <article class="character-card">
      <div class="character-image">${item.image ? `<img src="${escapeAttr(item.image)}" alt="">` : `✦ ${i + 1}`}</div>
      <div class="character-info">
        <h3 class="character-name">${escapeHtml(item.name || "")}</h3>
        <p class="character-role">${escapeHtml(item.role || "")}</p>
      </div>
    </article>
  `).join("");

  const commissions = site.commissions || [];
  document.getElementById("commissionCount").textContent = `${commissions.length} ARCHIVES`;
  document.getElementById("commissionGrid").innerHTML = commissions.map((item, i) => `
    <a class="commission-card" href="${escapeAttr(item.link || item.image || "#")}" target="_blank" rel="noopener">
      <div class="commission-image">${item.image ? `<img src="${escapeAttr(item.image)}" alt="">` : `✦ ${String(i + 1).padStart(2, "0")}`}</div>
      <div class="commission-info">
        <h3>${escapeHtml(item.name || "")}</h3>
        <p>${escapeHtml(item.note || "")}</p>
      </div>
    </a>
  `).join("");
}

/* ===== 화면 전환 (스크롤 없이 버튼으로) ===== */
function go(name) {
  const next = document.getElementById("screen-" + name);
  if (!next) return;
  document.querySelectorAll(".screen.active").forEach(s => s.classList.remove("active"));
  next.classList.add("active");
  next.scrollTop = 0;
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
}
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-go]");
  if (btn) go(btn.dataset.go);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") go("home");
  if (e.key === "Enter" && document.getElementById("screen-intro").classList.contains("active")) go("home");
});
// 주소 끝에 #characters 처럼 붙어 있으면 그 화면으로 바로 열기
const start = location.hash.slice(1);
if (start && start !== "intro") go(start);

function text(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}
function link(id, href, label) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = label;
  if (href) el.href = href; else el.style.display = "none";
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[ch]));
}
function escapeAttr(value) { return escapeHtml(value); }

loadSite();

</script>
</body>
</html>
