<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OUR LITTLE UNIVERSE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet">
  <style>
/* ===== X-RAY ARCHIVE THEME v2 (화면 전환형) ===== */
:root {
  --bg: #0b0c0e;
  --ink: #e9f1f7;
  --dim: #8a96a3;
  --line: rgba(233, 241, 247, 0.55);
  --faint: rgba(233, 241, 247, 0.12);
  --glow: rgba(200, 225, 255, 0.55);
  --tint: #9fc4e8;
  --pink: #f2b8c6;
  --kr: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", var(--kr), monospace;
  --thin: "Josefin Sans", var(--kr), sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--kr); font-weight: 300; line-height: 1.7;
  letter-spacing: -0.01em; word-break: keep-all;
  counter-reset: chr com;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.mono { font-family: var(--mono); }
.small { font-size: 11px; letter-spacing: .2em; color: var(--dim); }

/* 배경: 격자 + 궤도선 + 노이즈 */
.bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 92% 6%, transparent 219px, var(--faint) 220px, transparent 221px),
    radial-gradient(circle at 4% 96%, transparent 299px, var(--faint) 300px, transparent 301px),
    radial-gradient(ellipse at 70% 20%, rgba(160,190,230,.10), transparent 55%),
    linear-gradient(var(--faint) 1px, transparent 1px) 0 0 / 120px 120px,
    linear-gradient(90deg, var(--faint) 1px, transparent 1px) 0 0 / 120px 120px;
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: 99; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
  opacity: .07; mix-blend-mode: screen;
}

/* ===== 화면 전환 ===== */
.screen {
  position: fixed; inset: 0;
  opacity: 0; visibility: hidden;
  transform: scale(1.03); filter: blur(6px);
  transition: opacity .7s ease, transform .7s ease, filter .7s ease, visibility 0s .7s;
}
.screen.active {
  opacity: 1; visibility: visible; transform: none; filter: none;
  transition: opacity .7s ease, transform .7s ease, filter .7s ease;
}

/* ===== 인트로 ===== */
.intro {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 18px; padding: 6vw; overflow: hidden;
}
.intro-scan {
  position: absolute; left: 0; right: 0; height: 35%; pointer-events: none;
  background: linear-gradient(transparent, rgba(200,225,255,.12), transparent);
  animation: scan 5s ease-in-out infinite;
}
@keyframes scan { from { top: -35%; } to { top: 100%; } }
.blink { animation: blink 1.4s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.intro h1 {
  font-weight: 200; font-size: clamp(32px, 6vw, 76px); line-height: 1.2;
  letter-spacing: -0.03em; text-shadow: 0 0 28px var(--glow);
}
.intro .coord { position: absolute; bottom: 30px; }
.subtitle { font-family: var(--thin); font-style: italic; font-size: 19px; color: var(--tint); }

.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; color: var(--dim); text-transform: uppercase; }
.eyebrow::before { content: "[ "; } .eyebrow::after { content: " ]"; }

.btn {
  margin-top: 26px; padding: 14px 40px;
  font-family: var(--mono); font-size: 13px; letter-spacing: .3em;
  border: 1px solid var(--ink); position: relative; transition: .3s;
}
.btn::after {
  content: ""; position: absolute; right: -5px; bottom: -5px; width: 9px; height: 9px;
  border-radius: 50%; border: 1px solid var(--ink); background: var(--bg);
}
.btn:hover { background: var(--ink); color: var(--bg); box-shadow: 0 0 30px var(--glow); }

/* ===== 홈 ===== */
.home {
  display: grid; grid-template-columns: 1fr 1fr; align-items: center;
  gap: 5vw; padding: 5vh 8vw;
}
.home-art { position: relative; aspect-ratio: 1; max-height: 78vh; justify-self: center; width: 100%; }
.orbit { position: absolute; border: 1px solid var(--line); border-radius: 50%; animation: spin 40s linear infinite; }
.orbit-a { inset: 0; border-style: dashed; opacity: .5; }
.orbit-b { inset: 16%; opacity: .3; animation-direction: reverse; animation-duration: 60s; }
.orbit-a::after {
  content: ""; position: absolute; top: 50%; left: -5px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--ink); box-shadow: 0 0 14px var(--glow);
}
@keyframes spin { to { transform: rotate(360deg); } }
.core {
  position: absolute; inset: 38%; display: grid; place-items: center;
  font-size: 40px; border-radius: 50%;
  background: radial-gradient(circle, rgba(200,225,255,.25), transparent 70%);
  text-shadow: 0 0 24px var(--glow);
}
.home-title { font-weight: 200; font-size: clamp(26px, 3.2vw, 44px); line-height: 1.3; margin: 10px 0 26px; letter-spacing: -0.03em; }

.hero-meta { display: flex; gap: 12px; margin-bottom: 30px; }
.hero-meta div { padding: 10px 16px; border: 1px solid var(--line); font-family: var(--mono); }
.hero-meta span { display: block; font-size: 10px; letter-spacing: .2em; color: var(--dim); }
.hero-meta strong { font-weight: 400; font-size: 13px; letter-spacing: .08em; }

.menu { display: flex; flex-direction: column; border-top: 1px solid var(--faint); }
.menu button {
  display: flex; align-items: baseline; gap: 18px; text-align: left;
  padding: 16px 4px; border-bottom: 1px solid var(--faint);
  font-family: var(--thin); font-weight: 300; font-size: clamp(20px, 2.2vw, 28px); letter-spacing: .08em;
  transition: .3s;
}
.menu em { font-family: var(--mono); font-style: normal; font-size: 11px; color: var(--dim); }
.menu small { margin-left: auto; font-family: var(--kr); font-size: 13px; color: var(--dim); letter-spacing: 0; }
.menu button:hover { padding-left: 18px; color: #fff; text-shadow: 0 0 16px var(--glow); }
.menu button:hover small { color: var(--pink); }

.hero-links { display: flex; gap: 10px; margin-top: 26px; }
.hero-links a { font-family: var(--mono); font-size: 12px; padding: 7px 14px; border: 1px solid var(--line); transition: .25s; }
.hero-links a:hover { background: var(--ink); color: var(--bg); }

/* ===== 서브 페이지 ===== */
.page { display: flex; flex-direction: column; padding: 0 6vw; }
.page-head {
  display: flex; align-items: center; gap: 24px; padding: 26px 0;
  border-bottom: 1px solid var(--faint); flex-shrink: 0;
}
.back { font-family: var(--mono); font-size: 12px; letter-spacing: .15em; padding: 6px 14px; border: 1px solid var(--line); transition: .25s; }
.back:hover { background: var(--ink); color: var(--bg); }
.count { margin-left: auto; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); padding: 5px 12px; }
.page-body { flex: 1; overflow-y: auto; padding: 40px 0 60px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
.page-body.center { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.page-body h2 {
  font-family: var(--thin); font-weight: 200; font-size: clamp(28px, 3.6vw, 46px);
  margin-bottom: 36px; text-shadow: 0 0 18px rgba(200,225,255,.35); letter-spacing: -0.02em;
}

.story-card {
  position: relative; max-width: 720px; padding: 40px 44px; text-align: left;
  border: 1px solid var(--line); background: rgba(255,255,255,.02);
  font-size: 16px; line-height: 2; white-space: pre-line;
}
.story-card::before {
  content: "world.txt"; position: absolute; top: -10px; left: 20px; padding: 0 8px;
  background: var(--bg); font-family: var(--mono); font-size: 11px; color: var(--dim);
}

/* ===== 사진: 평소엔 원본, 마우스 올리면 x-ray ===== */
.character-image img, .commission-image img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: filter .6s ease, transform .6s ease;
}
.character-card:hover img, .commission-card:hover img {
  filter: grayscale(1) invert(1) contrast(1.2) brightness(1.05)
          drop-shadow(0 0 10px rgba(200,225,255,.5));
  transform: scale(1.03);
}

/* 캐릭터 */
.character-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 340px)); justify-content: center; gap: 50px; padding-top: 20px; }
.character-card { position: relative; counter-increment: chr; }
.character-card:nth-child(even) { margin-top: 60px; }
.character-image {
  position: relative; aspect-ratio: 3 / 4; overflow: hidden;
  border: 1px solid var(--ink); background: #111419;
  display: grid; place-items: center; font-family: var(--mono); color: var(--dim);
}
.character-image::before {
  content: "subject_0" counter(chr) ".png"; position: absolute; z-index: 2; top: 10px; left: 12px;
  font-family: var(--mono); font-size: 11px; text-shadow: 0 0 6px #000;
}
.character-card:hover .character-image::before { content: "subject_0" counter(chr) ".xray"; color: var(--tint); }
.character-card::after {
  content: "-39.4567" counter(chr); position: absolute; top: -24px; right: -10px;
  font-family: var(--mono); font-size: 11px; padding: 2px 8px;
  border: 1px solid var(--line); background: rgba(159,196,232,.18);
}
.character-info { margin-top: 14px; padding-left: 14px; border-left: 1px solid var(--line); }
.character-name { font-weight: 400; font-size: 24px; letter-spacing: -0.02em; }
.character-role { font-size: 13px; color: var(--tint); }

/* 커미션 */
.commission-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px; }
.commission-card { display: block; counter-increment: com; }
.commission-image {
  position: relative; aspect-ratio: 1; overflow: hidden;
  border: 1px solid var(--line); background: #111419;
  display: grid; place-items: center; font-family: var(--mono); color: var(--dim);
  transition: border-color .3s, box-shadow .3s;
}
.commission-card:hover .commission-image { border-color: var(--ink); box-shadow: 0 0 30px var(--glow); }
.commission-image::before {
  content: "archive_" counter(com) ".png"; position: absolute; z-index: 2; bottom: 8px; right: 10px;
  font-family: var(--mono); font-size: 10px; text-shadow: 0 0 6px #000;
}
.commission-card:hover .commission-image::before { content: "archive_" counter(com) ".xray"; color: var(--tint); }
.commission-info { padding-top: 12px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.commission-info h3 { font-weight: 400; font-size: 16px; }
.commission-info p { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }

/* ===== 모바일 ===== */
@media (max-width: 820px) {
  .home { grid-template-columns: 1fr; overflow-y: auto; align-content: start; gap: 20px; padding: 6vh 7vw; }
  .home-art { max-width: 220px; }
  .character-card:nth-child(even) { margin-top: 0; }
  .story-card { padding: 30px 22px; }
  .page-head .eyebrow { display: none; }
}

</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- ===== 화면 0: 인트로 ===== -->
  <section class="screen intro active" id="screen-intro">
    <div class="intro-scan" aria-hidden="true"></div>
    <p class="mono small blink">[ SCANNING ARCHIVE . . . ]</p>
    <p class="eyebrow" id="eyebrow">DREAM COUPLE ARCHIVE</p>
    <h1 id="title">이 꿈을 보관할 수 있을까요?</h1>
    <p class="subtitle" id="tagline"></p>
    <button class="btn big" data-go="home">ENTER ↗</button>
    <p class="mono small coord">-39.4567 / 28.7896.543</p>
  </section>

  <!-- ===== 화면 1: 홈 ===== -->
  <section class="screen home" id="screen-home">
    <div class="home-art" aria-hidden="true">
      <div class="orbit orbit-a"></div>
      <div class="orbit orbit-b"></div>
      <div class="core">✦</div>
    </div>

    <div class="home-copy">
      <p class="eyebrow">OUR LITTLE UNIVERSE</p>
      <h2 class="home-title" id="homeTitle">이 꿈을 보관할 수 있을까요?</h2>

      <div class="hero-meta">
        <div><span>START</span><strong id="start"></strong></div>
        <div><span>STATUS</span><strong>FOREVER IN PROGRESS</strong></div>
      </div>

      <nav class="menu">
        <button data-go="story"><em>01</em> STORY <small>우리의 세계</small></button>
        <button data-go="characters"><em>02</em> CHARACTERS <small>두 사람</small></button>
        <button data-go="commission"><em>03</em> COMMISSION <small>그림으로 남긴 순간</small></button>
      </nav>

      <div class="hero-links">
        <a id="musicLink" href="#" target="_blank" rel="noopener">♫ Music</a>
        <a id="mainLink" href="#" target="_blank" rel="noopener">↗ Link</a>
      </div>
    </div>
  </section>

  <!-- ===== 화면 2: 스토리 ===== -->
  <section class="screen page" id="screen-story">
    <header class="page-head">
      <button class="back" data-go="home">← HOME</button>
      <p class="eyebrow">01 / STORY</p>
    </header>
    <div class="page-body center">
      <h2>우리의 세계</h2>
      <div class="story-card"><p id="worldDescription"></p></div>
    </div>
  </section>

  <!-- ===== 화면 3: 캐릭터 ===== -->
  <section class="screen page" id="screen-characters">
    <header class="page-head">
      <button class="back" data-go="home">← HOME</button>
      <p class="eyebrow">02 / CHARACTERS</p>
    </header>
    <div class="page-body">
      <h2>Two souls, one orbit</h2>
      <div class="character-grid" id="characterGrid"></div>
    </div>
  </section>

  <!-- ===== 화면 4: 커미션 ===== -->
  <section class="screen page" id="screen-commission">
    <header class="page-head">
      <button class="back" data-go="home">← HOME</button>
      <p class="eyebrow">03 / COMMISSION</p>
      <span class="count" id="commissionCount">0 ARCHIVES</span>
    </header>
    <div class="page-body">
      <h2>그림으로 남겨둔 순간들</h2>
      <div class="commission-grid" id="commissionGrid"></div>
    </div>
  </section>

  <script>
async function loadSite() {
  try {
    const response = await fetch("data/notion.json", { cache: "no-store" });
    const site = await response.json();
    renderSite(site);
  } catch (error) {
    console.error("Could not load site data:", error);
  }
}

function renderSite(site) {
  const world = site.world || {};
  document.title = world.browserTitle || "OUR LITTLE UNIVERSE";
  text("eyebrow", world.eyebrow || "DREAM COUPLE ARCHIVE");
  text("title", world.title || "");
  text("homeTitle", world.title || "");
  text("tagline", world.tagline || "");
  text("start", world.start || "");
  text("worldDescription", world.description || "");
  link("musicLink", world.music, "♫ Music");
  link("mainLink", world.link, "↗ Link");

  const characters = site.characters || [];
  document.getElementById("characterGrid").innerHTML = characters.map((item, i) => `
    <article class="character-card">
      <div class="character-image">${item.image ? `<img src="${escapeAttr(item.image)}" alt="">` : `✦ ${i + 1}`}</div>
      <div class="character-info">
        <h3 class="character-name">${escapeHtml(item.name || "")}</h3>
        <p class="character-role">${escapeHtml(item.role || "")}</p>
      </div>
    </article>
  `).join("");

  const commissions = site.commissions || [];
  document.getElementById("commissionCount").textContent = `${commissions.length} ARCHIVES`;
  document.getElementById("commissionGrid").innerHTML = commissions.map((item, i) => `
    <a class="commission-card" href="${escapeAttr(item.link || item.image || "#")}" target="_blank" rel="noopener">
      <div class="commission-image">${item.image ? `<img src="${escapeAttr(item.image)}" alt="">` : `✦ ${String(i + 1).padStart(2, "0")}`}</div>
      <div class="commission-info">
        <h3>${escapeHtml(item.name || "")}</h3>
        <p>${escapeHtml(item.note || "")}</p>
      </div>
    </a>
  `).join("");
}

/* ===== 화면 전환 (스크롤 없이 버튼으로) ===== */
function go(name) {
  const next = document.getElementById("screen-" + name);
  if (!next) return;
  document.querySelectorAll(".screen.active").forEach(s => s.classList.remove("active"));
  next.classList.add("active");
  next.scrollTop = 0;
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
}
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-go]");
  if (btn) go(btn.dataset.go);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") go("home");
  if (e.key === "Enter" && document.getElementById("screen-intro").classList.contains("active")) go("home");
});
// 주소 끝에 #characters 처럼 붙어 있으면 그 화면으로 바로 열기
const start = location.hash.slice(1);
if (start && start !== "intro") go(start);

function text(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}
function link(id, href, label) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = label;
  if (href) el.href = href; else el.style.display = "none";
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[ch]));
}
function escapeAttr(value) { return escapeHtml(value); }

loadSite();

</script>
</body>
</html>
